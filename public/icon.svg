<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="100" fill="#000000"/>
  
  <g fill="#FFFFFF" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top detached dot/pill (head) -->
    <rect x="186" y="112" width="34" height="52" rx="17" transform="rotate(-22 203 138)" stroke="none"/>
    
    <!-- Bottom-left detached dot/pill -->
    <rect x="178" y="348" width="52" height="34" rx="17" transform="rotate(-30 204 365)" stroke="none"/>
    
    <!-- Central intersection and main limbs -->
    <!-- Left arm extending slightly downward to the left -->
    <path d="M 235,260 L 98,228" stroke-width="50"/>
    
    <!-- Upper right arm extending up and to the right -->
    <path d="M 235,260 L 420,180" stroke-width="50"/>
    
    <!-- Neck pointing towards top dot -->
    <path d="M 235,260 L 210,195" stroke-width="50"/>
    
    <!-- Bottom right leg extending long to bottom right -->
    <path d="M 235,260 L 338,416" stroke-width="52"/>
    
    <!-- Central connecting fillet -->
    <circle cx="235" cy="260" r="30" stroke="none"/>
  </g>
</svg>
