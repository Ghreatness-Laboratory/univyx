<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Univyx — Revolutionalizing the student experience.</title>
    <meta name="description" content="Revolutionalizing the student experience. The social platform exclusively for private university students." />
    
    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Univyx — Revolutionalizing the student experience." />
    <meta property="og:description" content="Revolutionalizing the student experience. The social platform exclusively for private university students." />
    
    <!-- PWA & Mobile Web App meta tags -->
    <meta name="theme-color" id="meta-theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Univyx" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />

    <!-- Google Fonts: Poppins & Figtree -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet" />

    <!-- Instant Pre-paint Theme & Typography Script (Eliminates Flash of Unstyled Content) -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('univyx_theme') || 'system';
          var isDark = false;
          if (savedTheme === 'dark') {
            isDark = true;
          } else if (savedTheme === 'light') {
            isDark = false;
          } else {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
            var meta = document.getElementById('meta-theme-color');
            if (meta) meta.setAttribute('content', '#0A0F1E');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
            var meta = document.getElementById('meta-theme-color');
            if (meta) meta.setAttribute('content', '#F4F7FC');
          }

          var savedTextSize = localStorage.getItem('univyx_text_size') || '15';
          var pxVal = parseInt(savedTextSize, 10);
          if (isNaN(pxVal)) {
            if (savedTextSize === 'small') pxVal = 13;
            else if (savedTextSize === 'large') pxVal = 17;
            else if (savedTextSize === 'extra-large') pxVal = 19;
            else pxVal = 15;
          }
          document.documentElement.style.setProperty('--app-font-size', pxVal + 'px');
          document.documentElement.style.setProperty('--text-scale', (pxVal / 15).toString());
          document.documentElement.setAttribute('data-text-size', pxVal.toString());
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-surface text-primary antialiased selection:bg-[#1D9BF0]/20 selection:text-[#1D9BF0] overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
